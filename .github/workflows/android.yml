
name: Build AHMED STUDY OS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            find . -type f
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      -      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a5e7f3a6f6b3e9b7b5a4f4f5f5f" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHMED-STUDY-OS-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
